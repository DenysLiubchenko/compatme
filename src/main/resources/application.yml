spring:
  application:
    name: compatme
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/compatme?retryReads=true&retryWrites=true&w=majority}
      # Without this, Spring Data MongoDB silently ignores @Indexed annotations (e.g. the unique
      # index on ProfileDocument.telegramUserId) — they'd never actually be created in MongoDB.
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # Transport-level ceiling only. The authoritative limit (photo-storage.max-size-bytes) is
      # enforced in the application layer so users get a clear, specific error message.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,mongo,minio

resilience4j:
  circuitbreaker:
    instances:
      gemini:
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      nominatim:
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      minio:
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - ua.kpi.project.compatme.application.exception.PhotoStorageException
  bulkhead:
    instances:
      gemini:
        max-concurrent-calls: 10
        max-wait-duration: 0
      nominatim:
        max-concurrent-calls: 2
        max-wait-duration: 0
      minio:
        max-concurrent-calls: 20
        max-wait-duration: 0

gemini:
  api-key: ${GEMINI_API_KEY:}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  embedding-dimensionality: ${GEMINI_EMBEDDING_DIMENSIONALITY:768}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
  max-retry-attempts: ${GEMINI_MAX_RETRY_ATTEMPTS:4}
  retry-initial-backoff-millis: ${GEMINI_RETRY_INITIAL_BACKOFF_MILLIS:1000}
  retry-backoff-multiplier: ${GEMINI_RETRY_BACKOFF_MULTIPLIER:2.0}

telegram:
  enabled: ${TELEGRAM_BOT_ENABLED:false}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  bot-username: ${TELEGRAM_BOT_USERNAME:}
  backend-base-url: ${TELEGRAM_BACKEND_BASE_URL:http://localhost:8082}

photo-storage:
  max-size-bytes: ${PHOTO_MAX_SIZE_BYTES:5242880}
  allowed-content-types: ${PHOTO_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
  max-photos-per-profile: ${PHOTO_MAX_PER_PROFILE:6}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:19000}
    # Local Docker Compose defaults. Override both in every non-local environment.
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:compatme-photos}

nominatim:
  base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
  user-agent: ${NOMINATIM_USER_AGENT:CompatMe-Thesis-Project/1.0 (university thesis, non-commercial)}
  min-request-interval-millis: ${NOMINATIM_MIN_REQUEST_INTERVAL_MILLIS:1100}

app:
  okcupid:
    enabled: ${OKCUPID_IMPORT_ENABLED:false}
    csv-resource: ${OKCUPID_CSV_RESOURCE:classpath:okcupid_profiles.csv}
    max-profiles: ${OKCUPID_MAX_PROFILES:1000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    ua.kpi.project.compatme: DEBUG
